<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweets Tower - 第26弾</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fce4ec; font-family: sans-serif; touch-action: none; }
        #ad-top, #ad-bottom { position: fixed; left: 0; width: 100%; height: 150px; background: #333; z-index: 100; display: flex; align-items: center; justify-content: center; }
        #ad-top { top: 0; } #ad-bottom { bottom: 0; }
        iframe { border: none; width: 100%; height: 150px; }
        canvas { display: block; margin-top: 150px; background: #fff1f2; }
        #ui { position: absolute; top: 160px; left: 0; width: 100%; text-align: center; color: #ad1457; font-size: 24px; font-weight: bold; pointer-events: none; }
        #startScreen { position: absolute; top: 150px; left: 0; width: 100%; height: calc(100vh - 300px); background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; }
        #goButton { padding: 15px 45px; font-size: 24px; background: #f06292; border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="ad-top"><iframe src="ad.html"></iframe></div>
    <div id="ad-bottom"><iframe src="ad.html"></iframe></div>
    <div id="startScreen"><h1>Sweets Tower</h1><p>タイミングよくタップして<br>パンケーキを高く積もう！🥞</p><button id="goButton">開店！</button></div>
    <div id="ui">TOWER: 0</div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 300;
        let score = 0, gameActive = false, speed = 3;
        let layers = []; // {x, y, w}
        let current = { x: 0, w: 150, dir: 1 };

        document.getElementById("goButton").onclick = () => {
            document.getElementById("startScreen").style.display = "none";
            gameActive = true; score = 0; layers = [{x: canvas.width/2 - 75, w: 150, y: canvas.height - 40}];
            current = { x: 0, w: 150, dir: 1, y: canvas.height - 80 };
            update();
        };

        window.addEventListener("touchstart", () => {
            if(!gameActive) return;
            let last = layers[layers.length - 1];
            let diff = current.x - last.x;
            if(Math.abs(diff) >= current.w) { gameOver(); return; }
            
            // はみ出た分を削る
            if(diff > 0) { current.w -= diff; } else { current.w += diff; current.x = last.x; }
            
            layers.push({x: current.x, y: current.y, w: current.w});
            score++; document.getElementById("ui").innerText = "TOWER: " + score;
            
            // 次の層へ（画面がたまるとスクロール）
            if(layers.length > 5) layers.forEach(l => l.y += 40);
            else current.y -= 40;
            current.x = 0; speed += 0.2;
        });

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            current.x += speed * current.dir;
            if(current.x + current.w > canvas.width || current.x < 0) current.dir *= -1;
            
            ctx.fillStyle = "#ffb74d";
            layers.forEach(l => ctx.fillRect(l.x, l.y, l.w, 35));
            ctx.fillStyle = "#f06292";
            ctx.fillRect(current.x, current.y, current.w, 35);
            requestAnimationFrame(update);
        }

        function gameOver() { gameActive = false; alert("崩れちゃった！ SCORE: " + score); location.reload(); }
        setInterval(() => { const fs = document.querySelectorAll('iframe'); fs.forEach(f => { const s = f.src; f.src = "about:blank"; setTimeout(() => f.src = s, 100); }); }, 30000);
    </script>
</body>
</html>
