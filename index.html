<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweets Tower - Pancake Stack</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1299640300068792" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; position: fixed; touch-action: none; }
        body { background: #fff1f2; font-family: 'Hiragino Sans', 'Meiryo', sans-serif; display: flex; flex-direction: column; }
        
        /* 上部広告：100px 固定 */
        #ad-top { width: 100%; height: 100px; background: #263238; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 100; border-bottom: 3px solid #f06292; }

        /* ゲームエリア：広告の下すべて */
        #game-outer { flex-grow: 1; position: relative; width: 100%; background: #fff1f2; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; font-size: 28px; font-weight: bold; color: #ad1457; z-index: 10; display: none; text-shadow: 2px 2px 0 white; }

        /* メニュー画面 */
        #menuScreen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.97); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 500; padding: 20px; 
        }

        /* 【収益】300x250 レクタングル */
        #ad-middle-box {
            width: 300px; height: 250px; background: #f5f5f5;
            margin: 15px 0; display: none; justify-content: center; align-items: center;
            border-radius: 12px; border: 1px solid #ffc1e3; overflow: hidden;
        }

        .menu-btn-group { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 15px; }
        .menu-btn { width: 270px; padding: 18px; font-size: 20px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; transition: 0.2s; }
        #retry-btn { background: #f06292; color: white; box-shadow: 0 5px #d81b60; }
        #retry-btn:active { transform: translateY(3px); box-shadow: none; }
        #retry-btn:disabled { background: #ccc; box-shadow: none; transform: none; color: #888; }
        .sub-btn { background: #9b59b6; color: white; box-shadow: 0 5px #8e44ad; font-size: 16px; }

        /* インタースティシャル */
        #inter-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 99999; align-items: center; justify-content: center; }
        .inter-content { width: 330px; height: 350px; background: #fff; position: relative; border-radius: 15px; }
        #close-ad-btn { position: absolute; top: -55px; right: 0; width: 45px; height: 45px; background: #333; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid #fff; cursor: pointer; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="ad-top">
        <ins class="adsbygoogle" style="display:inline-block;width:320px;height:100px" data-ad-client="ca-pub-1299640300068792" data-ad-slot="3972022911"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <div id="game-outer">
        <div id="ui">TOWER: 0</div>
        <canvas id="gameCanvas"></canvas>

        <div id="menuScreen">
            <h2 id="result-msg" style="color:#f06292; margin: 5px 0; font-size: 34px; text-shadow: 1px 1px 0 #ad1457;">Sweets Tower</h2>
            <p id="menu-desc" style="margin:5px 0; font-size: 16px; color: #880e4f; font-weight: bold; text-align: center; line-height: 1.4;">パンケーキを高く積もう！🥞</p>
            
            <div id="ad-middle-box">
                <ins class="adsbygoogle" style="display:inline-block;width:300px;height:250px" data-ad-client="ca-pub-1299640300068792" data-ad-slot="9050127185"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>

            <div class="menu-btn-group">
                <button id="retry-btn" class="menu-btn" onclick="startNewGame()">★ スタート！ ★</button>
                <a href="https://saaaachi.github.io/" class="sub-btn menu-btn">他のゲームで遊ぶ</a>
            </div>
        </div>

        <div id="inter-screen">
            <div class="inter-content">
                <div id="close-ad-btn" onclick="closeInterAd()">5</div>
                <iframe id="ifr-inter" src="about:blank" style="width:100%; height:100%; border:none; border-radius:15px; background:#fff;"></iframe>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas"), ctx = canvas.getContext("2d"), gameOuter = document.getElementById("game-outer"), menuScreen = document.getElementById("menuScreen"), adMid = document.getElementById("ad-middle-box"), resultMsg = document.getElementById("result-msg"), retryBtn = document.getElementById("retry-btn"), ui = document.getElementById("ui");

        function resize() {
            canvas.width = gameOuter.clientWidth;
            canvas.height = gameOuter.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0, bestScore = localStorage.getItem("tower_best") || 0, gameActive = false, speed = 3.2, playCount = 0;
        let layers = [];
        let current = { x: 0, w: 140, dir: 1, y: 0 };

        function startNewGame() {
            menuScreen.style.display = "none";
            adMid.style.display = "none";
            ui.style.display = "block";
            score = 0;
            speed = 3.2;
            ui.innerText = "TOWER: 0";
            layers = [{x: canvas.width/2 - 70, w: 140, y: canvas.height - 50}];
            current = { x: 0, w: 140, dir: 1, y: canvas.height - 95 };
            gameActive = true;
            update();
        }

        window.addEventListener("touchstart", (e) => {
            if(!gameActive) return;
            e.preventDefault();
            stackLayer();
        }, {passive: false});

        function stackLayer() {
            let last = layers[layers.length - 1];
            let diff = current.x - last.x;
            
            if(Math.abs(diff) >= current.w) { gameOver("崩れちゃった！💦"); return; }
            
            if(diff > 0) { current.w -= diff; } 
            else { current.w += diff; current.x = last.x; }
            
            layers.push({x: current.x, y: current.y, w: current.w});
            score++;
            ui.innerText = "TOWER: " + score;
            
            if(layers.length > 5) {
                layers.forEach(l => l.y += 45);
            } else {
                current.y -= 45;
            }
            
            current.x = 0; 
            speed += 0.18;
            if(speed > 10) speed = 10;
        }

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            
            current.x += speed * current.dir;
            if(current.x + current.w > canvas.width || current.x < 0) current.dir *= -1;
            
            ctx.fillStyle = "#ffb74d";
            ctx.strokeStyle = "#e67e22";
            ctx.lineWidth = 2;
            layers.forEach(l => { drawRoundRect(l.x, l.y, l.w, 40, 15); });
            
            ctx.fillStyle = "#f06292";
            drawRoundRect(current.x, current.y, current.w, 40, 15);
            
            requestAnimationFrame(update);
        }

        function drawRoundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function gameOver(msg) {
            gameActive = false;
            playCount++;
            
            if(score > bestScore) {
                bestScore = score;
                localStorage.setItem("tower_best", bestScore);
            }

            resultMsg.innerText = "GAME OVER";
            document.getElementById("menu-desc").innerHTML = msg + "<br>SCORE: " + score;
            
            retryBtn.innerText = "お待ちください...";
            retryBtn.disabled = true;
            adMid.style.display = "flex";
            menuScreen.style.display = "flex";

            setTimeout(() => {
                retryBtn.disabled = false;
                retryBtn.innerText = "もう一度焼く！";
            }, 1500);

            if (playCount % 3 === 0) {
                setTimeout(showInterAd, 500);
            }
        }

        function showInterAd() {
            const screen = document.getElementById("inter-screen"), 
                  closeBtn = document.getElementById("close-ad-btn"), 
                  ifr = document.getElementById('ifr-inter');
            ifr.src = './ad.large.html?v=' + Date.now();
            screen.style.display = "flex";
            let timerVal = 5;
            closeBtn.innerText = timerVal;
            closeBtn.style.pointerEvents = "none";
            const countdown = setInterval(() => {
                timerVal--;
                if (timerVal > 0) {
                    closeBtn.innerText = timerVal;
                } else {
                    clearInterval(countdown);
                    closeBtn.innerText = "×";
                    closeBtn.style.pointerEvents = "auto";
                }
            }, 1000);
        }

        function closeInterAd() {
            document.getElementById("inter-screen").style.display = "none";
            document.getElementById('ifr-inter').src = 'about:blank';
        }

        window.onload = () => { menuScreen.style.display = "flex"; };
    </script>
</body>
</html>
