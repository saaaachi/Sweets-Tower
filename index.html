<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweets Tower - v26.1</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #fce4ec; font-family: sans-serif; touch-action: none; position: fixed; width: 100%; height: 100%; }
        
        /* 広告エリアを100pxに縮小してスペースを確保 */
        #ad-top, #ad-bottom { position: fixed; left: 0; width: 100%; height: 100px; background: #333; z-index: 100; display: flex; align-items: center; justify-content: center; }
        #ad-top { top: 0; } #ad-bottom { bottom: 0; }
        iframe { border: none; width: 100%; height: 100px; }

        #game-outer { position: absolute; top: 100px; bottom: 100px; left: 0; right: 0; background: #fff1f2; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 10px; left: 0; width: 100%; text-align: center; color: #ad1457; font-size: 24px; font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 1px 1px 0 white; }

        #menuScreen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.96); display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start; z-index: 50; 
            padding: 5px 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
        }

        /* 中央広告の高さも少し抑える */
        #ad-middle-container { width: 300px; height: 120px; background: #000; margin: 5px 0; display: none; justify-content: center; align-items: center; overflow: hidden; flex-shrink: 0; }

        .btn-group { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 6px; padding-bottom: 15px; }
        #goButton { padding: 12px 0; font-size: 18px; background: #f06292; border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; width: 200px; box-shadow: 0 4px #d81b60; }
        .link-btn { padding: 8px 0; font-size: 13px; background: #9b59b6; border: none; border-radius: 50px; color: white; font-weight: bold; text-decoration: none; width: 200px; text-align: center; box-shadow: 0 3px #8e44ad; }
    </style>
</head>
<body>

    <div id="ad-top"><iframe src="ad.html"></iframe></div>

    <div id="game-outer">
        <div id="ui">TOWER: 0</div>
        <canvas id="gameCanvas"></canvas>

        <div id="menuScreen">
            <h1 id="menuTitle" style="color:#f06292; margin: 2px 0; font-size: 22px;">Sweets Tower</h1>
            <p id="menuDesc" style="text-align: center; margin: 2px 0; font-size: 12px; color: #880e4f;">パンケーキを高く積もう！🥞</p>
            <p id="bestScoreText" style="margin: 2px 0; color:#ad1457; font-weight: bold; font-size: 14px;">BEST: 0</p>

            <div id="ad-middle-container">
                <script src="https://adm.shinobi.jp/s/1e6de436ea850948e238e975a93767eb"></script>
            </div>

            <div class="btn-group">
                <button id="goButton">開店！</button>
                <a href="https://saaaachi.github.io/Speedy-BBQ/" class="link-btn">他のゲームはこちら</a>
            </div>
        </div>
    </div>

    <div id="ad-bottom"><iframe src="ad.html"></iframe></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gameOuter = document.getElementById("game-outer");
        const menuScreen = document.getElementById("menuScreen");
        const adMid = document.getElementById("ad-middle-container");
        const goButton = document.getElementById("goButton");
        const bestText = document.getElementById("bestScoreText");

        function resize() {
            canvas.width = gameOuter.clientWidth;
            canvas.height = gameOuter.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0, bestScore = localStorage.getItem("tower_best") || 0, gameActive = false, speed = 3;
        let layers = [];
        let current = { x: 0, w: 150, dir: 1, y: 0 };
        bestText.innerText = "BEST: " + bestScore;

        goButton.onclick = () => {
            menuScreen.style.display = "none";
            gameActive = true;
            score = 0;
            speed = 3;
            document.getElementById("ui").innerText = "TOWER: 0";
            layers = [{x: canvas.width/2 - 60, w: 120, y: canvas.height - 40}];
            current = { x: 0, w: 120, dir: 1, y: canvas.height - 80 };
            update();
        };

        window.addEventListener("touchstart", (e) => {
            if(!gameActive) return;
            e.preventDefault();
            stackLayer();
        }, {passive: false});

        function stackLayer() {
            let last = layers[layers.length - 1];
            let diff = current.x - last.x;
            if(Math.abs(diff) >= current.w) { gameOver(); return; }
            if(diff > 0) { current.w -= diff; } else { current.w += diff; current.x = last.x; }
            layers.push({x: current.x, y: current.y, w: current.w});
            score++;
            document.getElementById("ui").innerText = "TOWER: " + score;
            if(layers.length > 6) { layers.forEach(l => l.y += 40); } else { current.y -= 40; }
            current.x = 0; speed += 0.15;
        }

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            current.x += speed * current.dir;
            if(current.x + current.w > canvas.width || current.x < 0) current.dir *= -1;
            ctx.fillStyle = "#ffb74d";
            layers.forEach(l => {
                ctx.beginPath();
                ctx.roundRect(l.x, l.y, l.w, 35, 10);
                ctx.fill();
            });
            ctx.fillStyle = "#f06292";
            ctx.beginPath();
            ctx.roundRect(current.x, current.y, current.w, 35, 10);
            ctx.fill();
            requestAnimationFrame(update);
        }

        function gameOver() {
            gameActive = false;
            if(score > bestScore) {
                bestScore = score;
                localStorage.setItem("tower_best", bestScore);
                bestText.innerText = "BEST: " + bestScore;
            }
            document.getElementById("menuTitle").innerText = "崩れちゃった！";
            document.getElementById("menuDesc").innerText = "記録: " + score + "段";
            goButton.innerText = "リトライ！";
            adMid.style.display = "flex"; 
            menuScreen.style.display = "flex";
            menuScreen.scrollTop = 0;
        }

        setInterval(() => {
            const fs = document.querySelectorAll('iframe');
            fs.forEach(f => {
                const s = f.src; f.src = "about:blank";
                setTimeout(() => f.src = s, 100);
            });
        }, 30000);
    </script>
</body>
</html>
