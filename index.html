<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweets Tower - v26.5</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #fce4ec; font-family: sans-serif; touch-action: none; position: fixed; width: 100%; height: 100%; }
        
        /* 広告枠：150px (共通仕様) */
        #ad-top, #ad-bottom { position: fixed; left: 0; width: 100%; height: 150px; background: #333; z-index: 100; display: flex; align-items: center; justify-content: center; }
        #ad-top { top: 0; border-bottom: 1px solid #444; } 
        #ad-bottom { bottom: 0; border-top: 1px solid #444; }
        iframe { border: none; width: 100%; height: 150px; background: #333; }

        /* ゲーム本体エリア */
        #game-outer { position: absolute; top: 150px; bottom: 150px; left: 0; right: 0; background: #fff1f2; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 10px; left: 0; width: 100%; text-align: center; color: #ad1457; font-size: 24px; font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 1px 1px 0 white; }

        /* メニュー画面 */
        #menuScreen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.96); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 200; 
            padding: 20px 0;
        }

        /* 中央広告（i-mobile） */
        #ad-middle-container { 
            width: 320px; height: 100px; background: #eee; margin: 15px 0; 
            display: none; justify-content: center; align-items: center; 
            overflow: hidden; flex-shrink: 0; border: 1px solid #ddd;
            transition: opacity 0.3s;
        }

        .btn-group { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 12px; }
        #goButton { width: 240px; padding: 15px; font-size: 18px; background: #f06292; border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px #d81b60; transition: 0.2s; }
        #goButton:disabled { background: #ccc; box-shadow: none; color: #888; cursor: default; }
        .link-btn { width: 240px; padding: 12px; font-size: 15px; background: #9b59b6; border: none; border-radius: 50px; color: white; font-weight: bold; text-decoration: none; text-align: center; box-shadow: 0 4px #8e44ad; }

        /* 大広告用カウントダウン付き */
        #bigAdScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3000; display: none; justify-content: center; align-items: center; }
        .ad-frame-wrapper { width: 95%; height: 85%; position: relative; }
        .ad-close-btn { 
            position: absolute; top: -15px; right: -15px; 
            color: white; font-size: 22px; font-weight: bold; 
            cursor: pointer; background: rgba(0,0,0,0.8); 
            width: 44px; height: 44px; border-radius: 50%; 
            display: none; align-items: center; justify-content: center; 
            z-index: 3100; border: 2px solid white; font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="ad-top"><iframe id="frame-top" src="./ad.html?pos=top"></iframe></div>

    <div id="game-outer">
        <div id="ui">TOWER: 0</div>
        <canvas id="gameCanvas"></canvas>

        <div id="menuScreen">
            <h1 id="menuTitle" style="color:#f06292; margin: 5px 0; font-size: 26px;">Sweets Tower</h1>
            <p id="menuDesc" style="text-align: center; margin: 0 0 10px 0; font-size: 14px; color: #880e4f;">パンケーキを高く積もう！🥞</p>
            <p id="bestScoreText" style="margin: 0 0 15px 0; color:#ad1457; font-weight: bold; font-size: 18px;">BEST: 0</p>

            <div id="ad-middle-container">
                <div id="im-8b492cea6667490da71c488bdcc7cfc8">
                    <script async src="https://imp-adedge.i-mobile.co.jp/script/v1/spot.js?20220104"></script>
                    <script>(window.adsbyimobile=window.adsbyimobile||[]).push({pid:84561,mid:590804,asid:1924211,type:"banner",display:"inline",elementid:"im-8b492cea6667490da71c488bdcc7cfc8"})</script>
                </div>
            </div>

            <div class="btn-group">
                <button id="goButton">開店！</button>
                <a href="https://saaaachi.github.io/" class="link-btn">他のゲームはこちら</a>
            </div>
        </div>

        <div id="bigAdScreen">
            <div class="ad-frame-wrapper">
                <div id="ad-close-btn" class="ad-close-btn" onclick="closeBigAd()"></div>
                <iframe id="ad-large-frame" src="" style="width:100%; height:100%; border:none;"></iframe>
            </div>
        </div>
    </div>

    <div id="ad-bottom"><iframe id="frame-bottom" src="./ad.html?pos=bottom"></iframe></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gameOuter = document.getElementById("game-outer");
        const menuScreen = document.getElementById("menuScreen");
        const adMid = document.getElementById("ad-middle-container");
        const goButton = document.getElementById("goButton");
        const bestText = document.getElementById("bestScoreText");

        function resize() {
            canvas.width = gameOuter.clientWidth;
            canvas.height = gameOuter.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0, bestScore = localStorage.getItem("tower_best") || 0, gameActive = false, speed = 3, playCount = 0;
        let layers = [];
        let current = { x: 0, w: 120, dir: 1, y: 0 };
        bestText.innerText = "BEST: " + bestScore;

        goButton.onclick = () => {
            menuScreen.style.display = "none";
            adMid.style.display = "none";
            gameActive = true;
            score = 0;
            speed = 3;
            document.getElementById("ui").innerText = "TOWER: 0";
            layers = [{x: canvas.width/2 - 60, w: 120, y: canvas.height - 40}];
            current = { x: 0, w: 120, dir: 1, y: canvas.height - 80 };
            update();
        };

        window.addEventListener("touchstart", (e) => {
            if(!gameActive) return;
            e.preventDefault();
            stackLayer();
        }, {passive: false});

        function stackLayer() {
            let last = layers[layers.length - 1];
            let diff = current.x - last.x;
            if(Math.abs(diff) >= current.w) { gameOver(); return; }
            if(diff > 0) { current.w -= diff; } else { current.w += diff; current.x = last.x; }
            layers.push({x: current.x, y: current.y, w: current.w});
            score++;
            document.getElementById("ui").innerText = "TOWER: " + score;
            if(layers.length > 6) { layers.forEach(l => l.y += 40); } else { current.y -= 40; }
            current.x = 0; speed += 0.15;
        }

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            current.x += speed * current.dir;
            if(current.x + current.w > canvas.width || current.x < 0) current.dir *= -1;
            
            ctx.fillStyle = "#ffb74d";
            layers.forEach(l => {
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(l.x, l.y, l.w, 35, 10); else ctx.rect(l.x, l.y, l.w, 35);
                ctx.fill();
            });
            
            ctx.fillStyle = "#f06292";
            ctx.beginPath();
            if(ctx.roundRect) ctx.roundRect(current.x, current.y, current.w, 35, 10); else ctx.rect(current.x, current.y, current.w, 35);
            ctx.fill();
            requestAnimationFrame(update);
        }

        function gameOver() {
            gameActive = false;
            playCount++;
            if(score > bestScore) {
                bestScore = score;
                localStorage.setItem("tower_best", bestScore);
                bestText.innerText = "BEST: " + bestScore;
            }

            // --- ✨ 誤タップ防止ガード (1.5秒) ---
            goButton.innerText = "お待ちください...";
            goButton.disabled = true;
            adMid.style.display = "flex";
            adMid.style.pointerEvents = "none";
            adMid.style.opacity = "0.4";

            document.getElementById("menuTitle").innerText = "崩れちゃった！";
            document.getElementById("menuDesc").innerText = "記録: " + score + "段";
            menuScreen.style.display = "flex";

            setTimeout(() => {
                adMid.style.pointerEvents = "auto";
                adMid.style.opacity = "1";
                goButton.disabled = false;
                goButton.innerText = "リトライ！";
            }, 1500);

            // 大広告判定
            if (playCount === 3 || (playCount > 3 && (playCount - 3) % 7 === 0)) {
                setTimeout(showBigAd, 500);
            }
        }

        function showBigAd() {
            const screen = document.getElementById("bigAdScreen");
            const closeBtn = document.getElementById("ad-close-btn");
            document.getElementById("ad-large-frame").src = "./ad.large.html?t=" + Date.now();
            screen.style.display = "flex";
            
            let countdown = 5;
            closeBtn.style.display = "flex";
            closeBtn.innerText = countdown;
            closeBtn.style.pointerEvents = "none";
            closeBtn.style.opacity = "0.7";

            const timerInt = setInterval(() => {
                countdown--;
                closeBtn.innerText = countdown;
                if (countdown <= 0) {
                    clearInterval(timerInt);
                    closeBtn.innerText = "×";
                    closeBtn.style.pointerEvents = "auto";
                    closeBtn.style.opacity = "1";
                }
            }, 1000);
        }

        function closeBigAd() {
            document.getElementById("bigAdScreen").style.display = "none";
            document.getElementById("ad-large-frame").src = "";
        }
    </script>
</body>
</html>
